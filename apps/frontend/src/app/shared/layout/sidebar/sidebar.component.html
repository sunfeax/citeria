<aside [class.collapsed]="!isExpandedSidebar()">
  <header>
    <app-brand [compact]="!isExpandedSidebar()" />
    <button
      matIconButton
      type="button"
      class="sidebar-toggle"
      [attr.aria-expanded]="isExpandedSidebar()"
      [attr.aria-label]="isExpandedSidebar() ? 'Collapse sidebar' : 'Expand sidebar'"
      (click)="toggleSidebar()"
    >
      @if (isExpandedSidebar()) {
        <mat-icon>chevron_left</mat-icon>
      } @else {
        <mat-icon>chevron_right</mat-icon>
      }
    </button>
  </header>
  <nav>
    @for (item of sidebarData; track item.label) {
      <a
        [routerLink]="item.path"
        [class.disabled]="item.disabled"
        [attr.aria-label]="!isExpandedSidebar() ? item.label : null"
        [attr.title]="!isExpandedSidebar() ? item.label : null"
      >
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <footer>
    <a
      class="user"
      [routerLink]="routePaths.profile"
      [attr.aria-label]="'Open profile: ' + displayName()"
      [attr.title]="!isExpandedSidebar() ? 'My profile' : null"
    >
      <span class="user-avatar" aria-hidden="true">
        @if (avatarSrc(); as src) {
          <img [src]="src" alt="" />
        } @else {
          <mat-icon>person</mat-icon>
        }
      </span>
      <span class="user-name">{{ displayName() }}</span>
    </a>
    <div class="sidebar-actions">
      @if (themeService.theme() === 'dark') {
        <button
          matIconButton
          type="button"
          aria-label="Switch to light theme"
          (click)="toggleTheme()"
        >
          <mat-icon>light_mode</mat-icon>
        </button>
      } @else {
        <button
          matIconButton
          type="button"
          aria-label="Switch to dark theme"
          (click)="toggleTheme()"
        >
          <mat-icon>dark_mode</mat-icon>
        </button>
      }
      <button
        class="logoutBtn"
        matIconButton
        type="button"
        aria-label="Logout"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </footer>
</aside>
