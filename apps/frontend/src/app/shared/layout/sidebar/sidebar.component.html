<aside [class.collapsed]="!isExpandedSidebar()">
  <header>
    <div class="brand">
      <img
        class="brand-logo"
        src="/assets/logos/citeria-mark.png"
        alt=""
        width="40"
        height="40"
      />
      <div class="brand-copy">
        <h3>Citeria</h3>
        <p>EXPERTISE MARKET</p>
      </div>
    </div>
    <button
      matIconButton
      type="button"
      class="sidebar-toggle"
      [attr.aria-expanded]="isExpandedSidebar()"
      [attr.aria-label]="isExpandedSidebar() ? 'Collapse sidebar' : 'Expand sidebar'"
      (click)="toggleSidebar()"
    >
      @if (isExpandedSidebar()) {
        <mat-icon>chevron_left</mat-icon>
      } @else {
        <mat-icon>chevron_right</mat-icon>
      }
    </button>
  </header>
  <nav>
    @for (item of sidebarData; track item.label) {
      <a
        [routerLink]="item.path"
        [class.disabled]="item.disabled"
        [attr.aria-label]="!isExpandedSidebar() ? item.label : null"
        [attr.title]="!isExpandedSidebar() ? item.label : null"
      >
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <footer>
    <div class="user">
      <span class="user-avatar" aria-hidden="true">
        <mat-icon>person</mat-icon>
      </span>
      <span class="user-name">{{ displayName() }}</span>
    </div>
    <div class="sidebar-actions">
      @if (themeService.theme() === 'dark') {
        <button
          matIconButton
          type="button"
          aria-label="Switch to light theme"
          (click)="toggleTheme()"
        >
          <mat-icon>light_mode</mat-icon>
        </button>
      } @else {
        <button
          matIconButton
          type="button"
          aria-label="Switch to dark theme"
          (click)="toggleTheme()"
        >
          <mat-icon>dark_mode</mat-icon>
        </button>
      }
      <button
        class="logoutBtn"
        matIconButton
        type="button"
        aria-label="Logout"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </footer>
</aside>
