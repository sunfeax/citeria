<div class="auth-page">
  <header class="auth-intro">
    <app-brand />
    <h1 class="page-title page-title--display">Forgot your password?</h1>
  </header>

  <div class="auth-card auth-card--message">
    <p class="auth-message__text">
      Password reset isn't available online yet. Email
      <a class="auth-link" href="mailto:support@citeria.com">support@citeria.com</a>
      to change your password.
    </p>
    <div class="auth-message__actions">
      <a [routerLink]="routePaths.login" class="auth-link">Back to login</a>
    </div>
  </div>
</div>
